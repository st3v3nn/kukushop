# Production nginx config for kukunisisi.co.ke
# - Routes / to the frontend container
# - Routes /api and /rider/stream to the backend server
# - Serves ACME challenge for certbot via /var/www/certbot

server {
  listen 80;
  server_name 167.86.123.246 kukunisisi.co.ke www.kukunisisi.co.ke;

  # ACME challenge location (certbot will write here)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server block (requires certificates at /etc/letsencrypt)
server {
  listen 443 ssl http2;
  server_name 167.86.123.246 kukunisisi.co.ke www.kukunisisi.co.ke;

  ssl_certificate /etc/letsencrypt/live/kukunisisi.co.ke/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kukunisisi.co.ke/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Frontend (static)
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # API proxy
  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
  }

  # SSE stream endpoint (keepalive)
  location /api/stream {
    proxy_pass http://server:4000/api/stream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;
  }

  # Static files for certbot
  location /robots.txt {
    proxy_pass http://frontend:80/robots.txt;
  }
}
