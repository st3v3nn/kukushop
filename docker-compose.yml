version: '3.8'
services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Use internal Postgres service in this compose file for consistency.
      # Updated to use the `db` service instead of host-local Postgres.
      - DATABASE_URL=postgresql://speedy_admin:secure_password_here@db:5432/speedy_bites
      - TOKEN_SECRET=your_secret_key_at_least_32_chars_long
      - MPESA_CONSUMER_KEY
      - MPESA_CONSUMER_SECRET
      - MPESA_SHORTCODE
      - MPESA_PASSKEY
      - MPESA_CALLBACK_BASE
    depends_on:
      - db
    ports:
      - "4000:4000"

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedy_admin
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: speedy_bites
    volumes:
      - db_data:/var/lib/postgresql/data


volumes:
  db_data:
