# Host nginx vhost to proxy KukuniSisi app
# Place this file under /etc/nginx/sites-available/kukunisisi.conf and symlink to sites-enabled

server {
  listen 80;
  server_name 144.91.99.168 kukunisisi.co.ke www.kukunisisi.co.ke;

  location = /sw.js {
    proxy_pass http://127.0.0.1:5173/sw.js;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "no-cache";
    add_header Content-Type "application/javascript; charset=utf-8";
  }

  location = /manifest.json {
    proxy_pass http://127.0.0.1:5173/manifest.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "no-cache";
    add_header Content-Type "application/manifest+json";
  }

  # Proxy frontend
  location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Proxy API to backend
  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
  }

  # ACME challenge (leave for certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }
}
