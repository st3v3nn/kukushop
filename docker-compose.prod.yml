services:
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - server

  frontend:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mike_admin:Mwa$$0152@db:5432/speedy_bites
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_BUSINESS_SHORTCODE: ${MPESA_BUSINESS_SHORTCODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_CALLBACK_BASE: ${MPESA_CALLBACK_BASE}
      MPESA_SANDBOX: ${MPESA_SANDBOX}
      MPESA_PARTYB: ${MPESA_PARTYB}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE}
    volumes:
      - ${UPLOAD_DIR:-/var/lib/kukunisisi/uploads}:${UPLOAD_DIR:-/var/lib/kukunisisi/uploads}:rw
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: mike_admin
      POSTGRES_PASSWORD: Mwa$$0152
      POSTGRES_DB: speedy_bites
    ports:
      - "54812:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mike_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
