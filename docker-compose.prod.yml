version: '3.8'
services:
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - server

  frontend:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_BUSINESS_SHORTCODE: ${MPESA_BUSINESS_SHORTCODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_CALLBACK_BASE: ${MPESA_CALLBACK_BASE}
      MPESA_SANDBOX: ${MPESA_SANDBOX}
      MPESA_PARTYB: ${MPESA_PARTYB}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UPLOAD_DIR:-/var/lib/kukunisisi/uploads}:${UPLOAD_DIR:-/var/lib/kukunisisi/uploads}:rw
    expose:
      - "4000"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedy_admin
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: speedy_bites
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
