version: '3.8'
services:
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - server

  frontend:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env.prod
    expose:
      - "4000"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedy_admin
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: speedy_bites
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
